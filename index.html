<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flappy Oktay Kayacan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 200;
            width: 80%;
            max-width: 400px;
        }

        .game-over-screen.show {
            display: block;
        }

        .game-over-screen h1 {
            color: #ff4444;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over-screen .final-score {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .game-over-screen .final-score span {
            color: #ffd700;
            font-weight: bold;
        }

        .game-over-screen button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            pointer-events: all;
        }

        .game-over-screen button:hover {
            background: #45a049;
        }

        .tap-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            text-align: center;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            display: none;
            z-index: 150;
        }

        .title h1 {
            font-size: 3em;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        .title p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .title.show {
            display: block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui">
            <div class="score">Puan: <span id="scoreValue">0</span></div>
            
            <div class="title show" id="titleScreen">
                <h1>🎮 FLAPPY</h1>
                <p style="font-size: 2.5em; margin: 10px 0;">OKTAY KAYACAN</p>
                <p style="margin-top: 30px;">Dokunarak Uç! ☝️</p>
            </div>

            <div class="game-over-screen" id="gameOverScreen">
                <h1>OYUN BİTTİ! 💀</h1>
                <div class="final-score">Son Puan: <span id="finalScore">0</span></div>
                <button onclick="location.reload()">Yeniden Başla</button>
            </div>

            <div class="tap-hint" id="tapHint">
                📱 Oyuna başlamak için dokunun
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
